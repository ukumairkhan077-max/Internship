<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sky &amp; Words — Weather &amp; Quote Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="scene" id="scene">

    <header class="topbar">
      <div class="brand">
        <span class="brand__eyebrow">Daily Dashboard</span>
        <h1 class="brand__title">Sky <span class="brand__amp">&amp;</span> Words</h1>
      </div>
      <div class="topbar__clock">
        <span id="clockTime">--:--</span>
        <span id="clockDate">—</span>
      </div>
    </header>

    <main class="grid">

      <!-- WEATHER PANEL -->
      <section class="panel panel--weather" aria-labelledby="weatherHeading">
        <div class="panel__head">
          <h2 id="weatherHeading" class="panel__title">Conditions</h2>
          <form id="citySearchForm" class="city-search" role="search">
            <input id="cityInput" type="text" placeholder="Search a city…" autocomplete="off" aria-label="Search city for weather" />
            <button type="submit" aria-label="Search">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
          </form>
        </div>

        <div id="weatherCard" class="weather-card" aria-live="polite">
          <div class="skeleton skeleton--weather"></div>
        </div>

        <button id="locateBtn" class="ghost-btn">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
          Use my location
        </button>
      </section>

      <!-- QUOTE PANEL -->
      <section class="panel panel--quote" aria-labelledby="quoteHeading">
        <div class="panel__head">
          <h2 id="quoteHeading" class="panel__title">Quote of the Moment</h2>
          <span class="panel__hint">Page 01</span>
        </div>

        <div id="quoteCard" class="quote-card" aria-live="polite">
          <div class="skeleton skeleton--quote"></div>
        </div>

        <div class="quote-actions">
          <button id="newQuoteBtn" class="btn btn--primary">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v6h6M20 20v-6h-6"/><path d="M20 8a8 8 0 0 0-14.9-3M4 16a8 8 0 0 0 14.9 3"/></svg>
            New quote
          </button>
          <button id="saveQuoteBtn" class="btn btn--ghost" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5 5 0 0 0-7.1 0L12 6.3l-1.7-1.7a5 5 0 1 0-7.1 7.1L12 20.3l8.8-8.6a5 5 0 0 0 0-7.1z"/></svg>
            <span id="saveQuoteLabel">Save</span>
          </button>
        </div>
      </section>

      <!-- FAVORITES -->
      <section class="panel panel--favorites" aria-labelledby="favHeading">
        <div class="panel__head">
          <h2 id="favHeading" class="panel__title">Favorite Lines</h2>
          <span class="panel__hint" id="favCount">0 saved</span>
        </div>

        <ul id="favorites" class="favorites-list"></ul>
        <p id="favEmpty" class="favorites-empty">Nothing saved yet — tap the heart on a quote you love.</p>
      </section>

    </main>

    <footer class="foot-note">Built with fetch, ES6 modules &amp; localStorage — no backend involved.</footer>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
