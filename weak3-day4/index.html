<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="left">

            <p class="hello">👋 Hi There</p>

            <h1>Create Account</h1>

            <p class="subtitle">
                Create your account to continue shopping.
            </p>

            <form id="form">

                <input type="text" name="username" placeholder="Enter your full name">

                <span id="username-error"></span>


                <input type="email" name="email" placeholder="Enter your email">

                <span id="email-error"></span>


                <input type="password" name="password" placeholder="Enter password">

                <span id="password-error"></span>


                <input type="password" name="confirm-password" placeholder="Confirm password">

                <span id="confirm-error"></span>


                <button type="submit">
                    Register
                </button>

            </form>

        </div>


        <div class="right">

            <img src="https://ukumairkhan077-max.github.io/Fullstack1-Ecommerece_project/assets/login-D4hhELg0.webp">

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
